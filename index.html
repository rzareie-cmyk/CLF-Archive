<style>

.drawers{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:14px}
.drawer{background:var(--navy);color:#f3ead3;padding:26px 20px 22px;cursor:pointer;position:relative;border-bottom:6px solid #0f1a3a;box-shadow:0 4px 0 #0f1a3a,0 8px 14px rgba(27,42,87,.25);transition:transform .15s}

.row{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);padding:10px 14px;margin-bottom:10px;cursor:pointer;border-right:4px solid var(--red);
background-image:repeating-linear-gradient(transparent 0 27px,rgba(27,42,87,.08) 27px 28px)}
.row:hover{border-right-color:var(--navy);transform:translateX(-3px)}
.thumb{width:70px;height:70px;border:5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.row h3{margin:0;font-family:Amiri,serif;font-size:22px;line-height:1.5}

.fig{margin:0;cursor:pointer}

.mount::after{bottom:3px;left:3px;border-bottom-width:5px;border-left-width:5px}

footer{border-top:1px solid var(--navy);margin:46px 0 30px;padding-top:12px;font-size:12px;color:var(--soft);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
